name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (for example v0.1.0)'
        required: true
        default: 'v0.1.0'
      publish:
        description: 'Create or update the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config git ca-certificates \
            libgtkmm-4.0-dev libgtk-4-dev \
            nlohmann-json3-dev libtomlplusplus-dev \
            libwayland-dev libwayland-bin wayland-protocols

      - name: Check dependency versions
        run: |
          echo "gtkmm-4.0:         $(pkg-config --modversion gtkmm-4.0)"
          echo "wayland-protocols: $(pkg-config --modversion wayland-protocols)"
          required=1.36
          found=$(pkg-config --modversion wayland-protocols)
          printf '%s\n%s\n' "$required" "$found" | sort -V -C || {
            echo "::error::wayland-protocols >= $required is required (found $found)"
            exit 1
          }

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Build
        run: ninja -C build

      - name: Check version matches tag
        run: |
          version=$(./build/paddeck --version | awk '{print $2}')
          echo "meson.build version: $version"
          echo "tag:                 $TAG"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Version in meson.build ($version) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build source and binary tarballs
        run: |
          version=$(./build/paddeck --version | awk '{print $2}')
          src_name="paddeck-$version"
          bin_name="paddeck-$version-x86_64-linux-gnu"

          meson dist -C build --no-tests
          mkdir -p dist "stage/$bin_name/bin" "stage/$bin_name/docs"

          cp "build/meson-dist/$src_name.tar.xz" dist/
          cp build/paddeck "stage/$bin_name/bin/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "stage/$bin_name/"
          cp docs/index.html docs/zh.html "stage/$bin_name/docs/"

          cat > "stage/$bin_name/README.txt" <<'EOF'
          paddeck — keyboard-driven scratchpad switcher for Umbriel
          =========================================================

          This archive contains a binary built on Ubuntu 24.04 (x86_64, glibc 2.39).

          Install:
            sudo install -Dm755 bin/paddeck /usr/local/bin/paddeck

          Runtime requirements:
            - an Umbriel (wlroots) Wayland session
            - GTK4 and gtkmm-4.0
            - wayland-client (wlr-layer-shell is implemented in-process)

          Window thumbnails additionally require the compositor to provide
          ext-image-copy-capture-v1 and ext-foreign-toplevel-list-v1.

          Usage:
            paddeck --help
            paddeck --dump

          Full documentation: docs/index.html (English), docs/zh.html (Chinese).
          EOF

          tar -C stage -cJf "dist/$bin_name.tar.xz" "$bin_name"
          (cd dist && sha256sum *.tar.xz > SHA256SUMS)
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paddeck-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" dist/*.tar.xz dist/SHA256SUMS --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "paddeck ${TAG#v}" \
              --generate-notes \
              dist/*.tar.xz dist/SHA256SUMS
          fi
