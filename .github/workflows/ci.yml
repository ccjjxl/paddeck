name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config git ca-certificates \
            libgtkmm-4.0-dev libgtk-4-dev \
            nlohmann-json3-dev libtomlplusplus-dev \
            libwayland-dev libwayland-bin wayland-protocols

      - name: Check dependency versions
        run: |
          echo "gtkmm-4.0:         $(pkg-config --modversion gtkmm-4.0)"
          echo "wayland-protocols: $(pkg-config --modversion wayland-protocols)"
          required=1.36
          found=$(pkg-config --modversion wayland-protocols)
          printf '%s\n%s\n' "$required" "$found" | sort -V -C || {
            echo "::error::wayland-protocols >= $required is required (found $found)"
            exit 1
          }

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Build
        run: ninja -C build

      - name: Smoke test
        run: ./build/paddeck --version

      - name: Verify source distribution
        run: meson dist -C build --no-tests
